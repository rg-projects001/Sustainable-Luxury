<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ṛta Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;600&display=swap">
<style>
html,body{margin:0}

/* Palette: beige and forest green. Layout: a loom ledger. Workstreams are warp lanes, stages are weft; every step is a knot you can pick up, move and retie. */
:root{
  --bg:#F2ECDF; --surface:#FBF8F1; --ink:#1E2A21; --muted:#5E665A; --line:#DCD2BF; --wash:#E9E1D0; --shade:rgba(30,42,33,.35);
  --wine:#264733; --wine-ink:#FBF8F1; --wine-soft:#DCE6D6;
  --done:#3E7A4C; --done-bg:#DFEBD8; --prog:#946A1E; --prog-bg:#F3E6CB; --open:#5F5290; --open-bg:#E7E3F0;
  --block:#A4532A; --block-bg:#F4E1D3; --todo:#857E6E; --todo-bg:#EEE8DB; --risk:#AE3326; --risk-bg:#F6DED7;
  --h1:#2F5D3A; --h2:#A5751E; --h3:#A4532A; --h4:#6A4A86; --h5:#2E6F73; --h6:#6B7A2E; --h7:#8F5B44; --h8:#4E5D72;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --ui:"IBM Plex Sans","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141813; --surface:#1C211B; --ink:#EEE8DA; --muted:#A8AC9C; --line:#323A2F; --wash:#222920; --shade:rgba(0,0,0,.55);
  --wine:#A9CDA9; --wine-ink:#132016; --wine-soft:#22342A;
  --done:#86C48F; --done-bg:#1E2F22; --prog:#E0B36A; --prog-bg:#33291A; --open:#B4A8DE; --open-bg:#262338;
  --block:#EBA07C; --block-bg:#38261B; --todo:#A4A091; --todo-bg:#23281F; --risk:#F08A80; --risk-bg:#3A1F1A;
  --h1:#8CC092; --h2:#E0B36A; --h3:#EBA07C; --h4:#BFA2DA; --h5:#7FBFC2; --h6:#C2CC7A; --h7:#D69C80; --h8:#9FB0CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141813; --surface:#1C211B; --ink:#EEE8DA; --muted:#A8AC9C; --line:#323A2F; --wash:#222920; --shade:rgba(0,0,0,.55);
  --wine:#A9CDA9; --wine-ink:#132016; --wine-soft:#22342A;
  --done:#86C48F; --done-bg:#1E2F22; --prog:#E0B36A; --prog-bg:#33291A; --open:#B4A8DE; --open-bg:#262338;
  --block:#EBA07C; --block-bg:#38261B; --todo:#A4A091; --todo-bg:#23281F; --risk:#F08A80; --risk-bg:#3A1F1A;
  --h1:#8CC092; --h2:#E0B36A; --h3:#EBA07C; --h4:#BFA2DA; --h5:#7FBFC2; --h6:#C2CC7A; --h7:#D69C80; --h8:#9FB0CC; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;color:var(--wine);text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}

header.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
header.top h1{font-size:clamp(32px,4.5vw,46px);line-height:1}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--todo)}
.mode.live i{background:var(--done)} .mode.local i{background:var(--prog)} .mode.ro i{background:var(--open)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.btn.danger{color:var(--risk);border-color:var(--risk)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ro-only{display:none}
body.readonly .edit-only{display:none!important}
body.readonly .ro-only{display:block}

.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) repeat(6,minmax(0,1fr));gap:10px;margin:18px 0 14px}
.overall{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.overall .big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;color:var(--wine);font-variant-numeric:tabular-nums}
.overall .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;display:flex}
.bar span{height:100%}
.tile{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{outline:2px solid var(--wine);outline-offset:1px}
.tile .n{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st-done{--c:var(--done);--cb:var(--done-bg)} .st-prog{--c:var(--prog);--cb:var(--prog-bg)} .st-open{--c:var(--open);--cb:var(--open-bg)}
.st-block{--c:var(--block);--cb:var(--block-bg)} .st-todo{--c:var(--todo);--cb:var(--todo-bg)} .st-risk{--c:var(--risk);--cb:var(--risk-bg)}
.dot{background:var(--c)} .st-todo .dot,.dot.st-todo{background:transparent;border:1.5px solid var(--todo)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.tabs button{white-space:nowrap;flex:none;border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--wine);color:var(--wine-ink)}
.toolbar input[type=search]{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:180px;flex:1;max-width:280px}
.toolbar select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.chk input{accent-color:var(--risk)}
.clear{background:none;border:0;color:var(--wine);cursor:pointer;font-size:13px;text-decoration:underline}
.resultnote{font-size:12.5px;color:var(--muted);margin:-6px 0 10px}

/* map */
.mapscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.map{display:grid;min-width:860px}
.colh{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--wash)}
.colh .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.colh .t{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1}
.corner{background:var(--wash);border-bottom:1px solid var(--line)}
.lane{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.lane b{font-size:13px}
.lane small{color:var(--muted);font-size:11.5px}
.lane .bar{max-width:120px}
.lane .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell{padding:8px;border-bottom:1px solid var(--line);border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:56px}
.cell.over,.col.over{background:var(--wine-soft)}
.addcell{opacity:0;border:1px dashed var(--line);background:none;border-radius:5px;padding:3px;color:var(--muted);cursor:pointer;font-size:12px}
.cell:hover .addcell,.addcell:focus-visible{opacity:1}
@media (hover:none){.addcell{opacity:.6}}

.knot{font:inherit;font-size:12.5px;line-height:1.3;text-align:left;cursor:pointer;border-radius:5px;padding:6px 8px 6px 9px;border:1px solid transparent;display:flex;flex-direction:column;gap:4px;color:var(--ink);background:var(--cb);position:relative;width:100%}
.knot .row1{display:flex;gap:7px;align-items:flex-start}
.knot .dot{margin-top:4px}
.knot.st-todo{background:var(--surface);border:1px dashed var(--todo)}
.knot.risk{box-shadow:inset 3px 0 0 var(--risk)}
.knot:hover{border-color:var(--muted)}
.knot.sel{outline:2px solid var(--wine)}
.knot.dim{opacity:.2}
.knot[draggable=true]{cursor:grab}
.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding-left:16px}
.pri{font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:3px;padding:0 5px;line-height:16px}
.p0{background:var(--risk);color:var(--wine-ink)} .p1{background:var(--block-bg);color:var(--block)} .p2{background:var(--wash);color:var(--muted)} .p3{background:transparent;color:var(--muted);border:1px solid var(--line)}
.who{font-size:11px;color:var(--muted)}
.due{font-size:11px;color:var(--muted)}
.due.late{color:var(--risk);font-weight:600}
.flag{font-size:10.5px;font-weight:600;color:var(--risk)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--wash);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{font-family:var(--ui);font-size:13px;color:var(--ink);display:flex;gap:7px;align-items:center;justify-content:space-between}
.col h3 span.c{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;width:100%}
.card.risk{border-left:3px solid var(--risk)}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:500;font-size:13px}
.card .ln{font-size:11px;color:var(--muted)}
.card .meta{padding-left:0}

/* list */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--wine);background:var(--wash);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px} th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
td.title{font-weight:500;min-width:220px}
td.title .flag{margin-left:6px}
td select{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:3px 6px;font-size:12.5px}

/* overview */
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-size:24px;margin-bottom:10px}
.lrow{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .bar{height:9px}
.lrow .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{border-bottom:1px solid var(--line)}
.ilist li:last-child{border-bottom:0}
.ilist button{background:none;border:0;width:100%;text-align:left;padding:9px 0;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.ilist .x{grid-column:2;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .rbar{width:3px;height:12px;background:var(--risk)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:24px}
.dbody{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.field textarea{resize:vertical;min-height:64px}
.field input.titlein{font-family:var(--display);font-size:22px;font-weight:600;padding:6px 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--wine));background:var(--cb,var(--wine-soft));font-weight:600}
.deps{border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:180px;overflow:auto;padding:6px}
.deps label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:4px;font-size:13px;cursor:pointer}
.deps label:hover{background:var(--wash)}
.deps small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--wash);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.note .when{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.note .when button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px}
.addnote{display:flex;gap:8px}
.addnote input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.stamp{font-size:11.5px;color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--bg);border:1px solid var(--line);border-radius:8px;z-index:41;display:flex;flex-direction:column}
.mtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;cursor:pointer;color:var(--muted);font-weight:500}
.mtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--wine)}
.rows{display:flex;flex-direction:column;gap:8px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.erow.one{grid-template-columns:minmax(0,1fr) auto}
.erow input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.ebtns{display:flex;gap:4px}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:30px;height:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{border-color:var(--muted)}
.help{font-size:12.5px;color:var(--muted)}
textarea.json{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.confirmbox{border:1px solid var(--risk);background:var(--risk-bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:30px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.emptystate h2{font-size:26px}



.field label.tick{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--ink)}
.tick{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.tick input{width:18px;height:18px;accent-color:var(--risk);margin:0}
.fbfield:has(#d-risk:checked) label.tick{border-color:var(--risk);background:var(--risk-bg);color:var(--risk)}
.fbfield:has(#d-risk:checked) textarea{border-color:var(--risk)}
.field textarea.big{min-height:130px;line-height:1.5}
.deplist{display:flex;flex-wrap:wrap;gap:6px}
.depchip{display:inline-flex;align-items:center;gap:6px;background:var(--cb);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;max-width:100%}
.depchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.depchip button{border:0;background:none;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;flex:none}
.depchip button:hover{background:var(--surface);color:var(--ink)}
.depchip.st-todo{background:var(--surface)}
#d-depadd{margin-top:2px}
/* ideas */
.ideahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ideahead h2{font-size:28px}
.ideahead .help{max-width:62ch;margin-top:4px}
.ideabar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ideabar select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.seg .c{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.ideagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.icard:hover{border-color:var(--muted)}
.icard.priv{border-style:dashed;background:var(--wash)}
.icard h3{font-family:var(--display);font-size:21px;line-height:1.15;color:var(--ink);margin:0}
.icard p{margin:0;font-size:13px;color:var(--ink);white-space:pre-line}
.itop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.icat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ist{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px}
.is-new{background:var(--open-bg);color:var(--open)} .is-exploring{background:var(--prog-bg);color:var(--prog)} .is-adopted{background:var(--done-bg);color:var(--done)} .is-parked{background:var(--todo-bg);color:var(--todo)}

<script>

  function apply(t){var r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
    var b=document.getElementById("themebtn");if(b){b.textContent={system:"Theme: System",light:"Theme: Light",dark:"Theme: Dark"}[t];b.setAttribute("aria-label","Colour theme: "+t+". Click to change.");}}
  window.RTA_THEME={cycle:function(){var order=["system","light","dark"],t=order[(order.indexOf(get())+1)%3];try{localStorage.setItem(KEY,t);}catch(e){}apply(t);},init:function(){apply(get());}};
  apply(get());
  document.addEventListener("DOMContentLoaded",function(){apply(get());var b=document.getElementById("themebtn");if(b)b.addEventListener("click",window.RTA_THEME.cycle);});
})();

<script type="module">
const cfg = window.RTA_FIREBASE_CONFIG;
if (!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith("PASTE")) {
  window.RTA_START(null);
} else {
  try {
    const V = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + V + "/";
    const appMod = await import(base + "firebase-app.js");
    const fa = await import(base + "firebase-auth.js");
    const fs = await import(base + "firebase-firestore.js");
    const app = appMod.initializeApp(cfg);
    const auth = fa.getAuth(app);
    const db = fs.getFirestore(app);
    const provider = new fa.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    window.RTA_START({
      db, fs,
      signIn: () => fa.signInWithPopup(auth, provider),
      signOut: () => fa.signOut(auth),
      onAuth: cb => fa.onAuthStateChanged(auth, cb)
    });
  } catch (e) {
    console.error(e);
    window.RTA_START(null);
  }
}
</script>

<div id="toastbox" aria-live="polite"></div>

<script>
window.RTA_SEED = /*__SEED__*/null;
(function(){
"use strict";
const STATUSES=[["todo","Not started"],["open","Waiting on a decision"],["prog","In progress"],["block","Blocked"],["done","Done"]];
const SLABEL=Object.fromEntries(STATUSES);
const PRI=[["0","P0","Critical"],["1","P1","High"],["2","P2","Medium"],["3","P3","Low"]];
const DEFAULT_CONFIG={lanes:[{id:"legal",name:"Name and legal",sub:""},{id:"story",name:"Brand and story",sub:""},{id:"identity",name:"Identity and experience",sub:""},{id:"supply",name:"Materials and supply",sub:""},{id:"fabric",name:"Fabric and testing",sub:""},{id:"product",name:"Product",sub:""},{id:"market",name:"Market and customers",sub:""},{id:"launch",name:"Launch",sub:""}],stages:[{id:"s1",name:"Foundations"},{id:"s2",name:"Make and prove the cloth"},{id:"s3",name:"Prove demand"},{id:"s4",name:"Launch and keep"}],people:["Rohith","Chaitu","Yasaswini","All"]};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const LSK="rta-tracker:v1";
const pref={get(k,d){try{const v=localStorage.getItem("rta-tracker-pref:"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("rta-tracker-pref:"+k,JSON.stringify(v));}catch(e){}}};

// ---------- state ----------
let config=null, tasks={}, ready=false, readOnly=false, mode="connecting";
let view=pref.get("view","map"), sortKey=pref.get("sortKey","priority"), sortDir=pref.get("sortDir",1);
const F={q:"",pri:"",own:"",lane:"",risk:false,status:""};
let me=null, userCap=null, downloadsCap=null;

function norm(t){return {id:t.id,title:t.title||"Untitled step",lane:t.lane||(config&&config.lanes[0]&&config.lanes[0].id)||"",stage:t.stage||(config&&config.stages[0]&&config.stages[0].id)||"",status:SLABEL[t.status]?t.status:"todo",priority:[0,1,2,3].includes(Number(t.priority))?Number(t.priority):2,owner:t.owner||"",due:t.due||"",what:t.what||"",fallback:t.fallback||"",atRisk:typeof t.atRisk==="boolean"?t.atRisk:!!t.fallback,rec:t.rec||"",needs:Array.isArray(t.needs)?t.needs.filter(x=>typeof x==="string"):[],notes:Array.isArray(t.notes)?t.notes:[],order:typeof t.order==="number"?t.order:0,updatedAt:t.updatedAt||"",updatedBy:t.updatedBy||""};}
function normCfg(c){c=c||{};return {lanes:Array.isArray(c.lanes)&&c.lanes.length?c.lanes:DEFAULT_CONFIG.lanes,stages:Array.isArray(c.stages)&&c.stages.length?c.stages:DEFAULT_CONFIG.stages,people:Array.isArray(c.people)?c.people:DEFAULT_CONFIG.people};}

// ---------- stores ----------
const LocalStore={
  mem:null,
  load(){let d=null;try{d=JSON.parse(localStorage.getItem(LSK)||"null");}catch(e){}
    if(!d&&this.mem)d=this.mem;
    if(!d&&window.RTA_SEED)d=JSON.parse(JSON.stringify(window.RTA_SEED));
    if(!d)d={config:DEFAULT_CONFIG,tasks:[]};
    this.mem=d;return d;},
  persist(){try{localStorage.setItem(LSK,JSON.stringify(this.mem));}catch(e){}},
  start(cb){const d=this.load();cb(normCfg(d.config),d.tasks.map(norm));},
  async saveTask(t){const i=this.mem.tasks.findIndex(x=>x.id===t.id);if(i>=0)this.mem.tasks[i]=t;else this.mem.tasks.push(t);this.persist();},
  async deleteTask(id){this.mem.tasks=this.mem.tasks.filter(x=>x.id!==id);this.persist();},
  async saveConfig(c){this.mem.config=c;this.persist();},
  async replaceAll(c,ts){this.mem={config:c,tasks:ts};this.persist();}
};
function DbStore(db){
  return {
    start(cb,onErr){let cfg=null,list=null;const fire=()=>{if(list)cb(normCfg(cfg),list);};
      db.doc("config/main").onSnapshot(s=>{cfg=s.exists?s.data():null;fire();},onErr);
      db.collection("tasks").onSnapshot(s=>{list=s.docs.map(d=>norm(Object.assign({},d.data(),{id:d.id})));fire();},onErr);},
    async saveTask(t){const b=Object.assign({},t);delete b.id;await db.doc("tasks/"+t.id).set(b);},
    async deleteTask(id){await db.doc("tasks/"+id).delete();},
    async saveConfig(c){await db.doc("config/main").set(c);},
    async replaceAll(c,ts){await db.doc("config/main").set(c);
      const keep=new Set(ts.map(t=>t.id));
      for(const id of Object.keys(tasks)){if(!keep.has(id))await db.doc("tasks/"+id).delete();}
      for(const t of ts){await this.saveTask(t);}}
  };
}
let store=LocalStore;

function onData(c,list){$(".toolbar").hidden=false;config=c;tasks=Object.fromEntries(list.map(t=>[t.id,t]));ready=true;fillFilters();render();if(openId&&drawerOpen&&!dirty)renderDrawer();}

let fbApi=null, fbUser=null, unsub=null;
function FbStore(api){const F_=api.fs, db=api.db;
  return {
    start(cb,onErr){let cfg=null,list=null;const fire=()=>{if(list)cb(normCfg(cfg),list);};
      const u1=F_.onSnapshot(F_.doc(db,"config","main"),s=>{cfg=s.exists()?s.data():null;fire();},onErr);
      const u2=F_.onSnapshot(F_.collection(db,"tasks"),s=>{list=s.docs.map(d=>norm(Object.assign({},d.data(),{id:d.id})));fire();},onErr);
      return ()=>{u1();u2();};},
    async saveTask(t){const b=Object.assign({},t);delete b.id;await F_.setDoc(F_.doc(db,"tasks",t.id),b);},
    async deleteTask(id){await F_.deleteDoc(F_.doc(db,"tasks",id));},
    async saveConfig(c){await F_.setDoc(F_.doc(db,"config","main"),c);},
    async replaceAll(c,ts){const ops=[["set",F_.doc(db,"config","main"),c]];
      const keep=new Set(ts.map(t=>t.id));Object.keys(tasks).forEach(id=>{if(!keep.has(id))ops.push(["del",F_.doc(db,"tasks",id)]);});
      ts.forEach(t=>{const b=Object.assign({},t);delete b.id;ops.push(["set",F_.doc(db,"tasks",t.id),b]);});
      for(let i=0;i<ops.length;i+=400){const batch=F_.writeBatch(db);ops.slice(i,i+400).forEach(o=>o[0]==="del"?batch.delete(o[1]):batch.set(o[1],o[2]));await batch.commit();}}
  };
}
window.RTA_START=function(api){
  fbApi=api;
  if(!api){store=LocalStore;mode="local";setMode();myUid="local";me=me||"You";store.start(onData);unsubIdeas=LocalStore.startIdeas(myUid,onIdeas);return;}
  api.onAuth(u=>{
    fbUser=u;renderAuth();
    if(unsub){unsub();unsub=null;}if(unsubIdeas){unsubIdeas();unsubIdeas=null;}ideas={};
    if(!u){ready=false;tasks={};mode="signedout";setMode();showSignIn();return;}
    me=u.displayName||u.email;myUid=u.uid;store=addFbIdeas(FbStore(api),api);mode="live";setMode();
    $("#view").innerHTML='<div class="loading">Loading the tracker…</div>';
    unsub=store.start(onData,e=>{if(e&&e.code==="permission-denied")showDenied(u.email);else toast("Live updates stopped. Reload the page to reconnect.");});
    unsubIdeas=store.startIdeas(u.uid,onIdeas,e=>{toast(e&&e.code==="permission-denied"?"Ideas are blocked by the Firestore rules. Publish the updated rules.":"Ideas stopped updating. Reload the page.");});
  });
};
function renderAuth(){const b=$("#authbox");if(!b)return;
  if(!fbApi){b.innerHTML="";return;}
  b.innerHTML=fbUser?`<span class="who" style="font-size:12.5px">${esc(fbUser.email)}</span><button class="btn small" data-act="signout">Sign out</button>`:`<button class="btn small primary" data-act="signin">Sign in with Google</button>`;
  $("#newbtn").hidden=!fbUser;$("#setbtn").hidden=!fbUser;}
function showSignIn(){$(".toolbar").hidden=true;$("#summary").innerHTML="";$("#resultnote").textContent="";$("#legend").hidden=true;
  $("#view").innerHTML=`<div class="emptystate"><h2>Sign in to open the tracker</h2><p class="help">The plan is private to the Ṛta team. Sign in with the Google account your email was added with.</p><button class="btn primary" data-act="signin">Sign in with Google</button></div>`;}
function showDenied(email){$(".toolbar").hidden=true;ready=false;$("#summary").innerHTML="";$("#legend").hidden=true;
  $("#view").innerHTML=`<div class="emptystate"><h2>This account isn't on the team list</h2><p class="help">You're signed in as ${esc(email)}. Ask whoever set up the tracker to add this email to the Firestore rules, or sign out and use the account they added.</p><button class="btn" data-act="signout">Sign out</button></div>`;}
function setMode(){const m=$("#mode");m.className="mode "+(mode==="signedout"?"ro":mode);
  m.querySelector("span").textContent={live:"Shared with the team · updates live",local:"Firebase isn't set up yet · saving in this browser only",signedout:"Signed out",connecting:"Connecting…"}[mode];
  document.body.classList.toggle("readonly",readOnly);}

// ---------- writes ----------
async function write(fn,okMsg){
  if(readOnly){toast("This tracker is view only for you.");return false;}
  try{await fn();if(store===LocalStore)store.start(onData);if(okMsg)toast(okMsg);return true;}
  catch(e){const code=e&&e.code;
    if(code==="permission-denied"){toast("Your account isn't on the team list, so this change wasn't saved.");}
    else if(code==="invalid_argument"&&store!==LocalStore){readOnly=true;mode="ro";setMode();toast("You don't have edit access, so this change wasn't saved.");}
    else if(code==="quota_exceeded")toast("The tracker is full. Delete old steps, then try again.");
    else toast("That didn't save. Check your connection and try again.");
    return false;}
}
function stamp(t){t.updatedAt=new Date().toISOString();if(me)t.updatedBy=me;return t;}
const saveTask=(t,msg)=>write(()=>store.saveTask(stamp(Object.assign({},t))),msg);

// ---------- filters ----------
function matches(t){
  if(F.status==="risk"){if(!t.atRisk)return false;}else if(F.status==="p0open"){if(!(t.priority===0&&t.status!=="done"))return false;}else if(F.status&&t.status!==F.status)return false;
  if(F.pri!==""&&String(t.priority)!==F.pri)return false;
  if(F.own&&t.owner!==F.own)return false;
  if(F.lane&&t.lane!==F.lane)return false;
  if(F.risk&&!t.atRisk)return false;
  if(F.q){const h=(t.title+" "+t.what+" "+t.fallback+" "+t.rec+" "+t.owner).toLowerCase();if(!h.includes(F.q.toLowerCase()))return false;}
  return true;}
const anyFilter=()=>F.q||F.pri!==""||F.own||F.lane||F.risk||F.status;
function fillFilters(){
  const keep=(sel,opts,first)=>{const v=sel.value;sel.innerHTML=first+opts;sel.value=v;};
  keep($("#fpri"),PRI.map(([v,k,l])=>`<option value="${v}">${k} ${l}</option>`).join(""),'<option value="">Any priority</option>');
  const people=[...new Set([...config.people,...Object.values(tasks).map(t=>t.owner).filter(Boolean)])];
  keep($("#fown"),people.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join(""),'<option value="">Anyone</option>');
  keep($("#flane"),config.lanes.map(l=>`<option value="${esc(l.id)}">${esc(l.name)}</option>`).join(""),'<option value="">All workstreams</option>');
}
const all=()=>Object.values(tasks);
const laneName=id=>{const l=config.lanes.find(x=>x.id===id);return l?l.name:"No workstream";};
const stageName=id=>{const s=config.stages.find(x=>x.id===id);return s?s.name:"No stage";};
const isLate=t=>t.due&&t.status!=="done"&&t.due<today();
const fmtDate=d=>{if(!d)return "";const [y,m,dd]=d.split("-");return `${Number(dd)} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(m)-1]||""}`;};
const byPri=(a,b)=>a.priority-b.priority||a.order-b.order||a.title.localeCompare(b.title);

// ---------- render ----------
function render(){
  if(!ready)return;
  renderSummary();
  $$(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  if(view==="ideas"||view==="mindmap"){$("#resultnote").textContent="";$("#legend").hidden=true;(view==="ideas"?renderIdeas:renderMindmap)();return;}
  const shown=all().filter(matches).length, total=all().length;
  $("#resultnote").textContent=anyFilter()?`Showing ${shown} of ${total} steps`:"";
  $("#legend").hidden=view==="overview";
  if(!total){renderEmpty();return;}
  ({map:renderMap,board:renderBoard,list:renderList,overview:renderOverview})[view]();
}
function renderEmpty(){
  $("#view").innerHTML=`<div class="emptystate"><h2>No steps yet</h2><p class="help">Add the first step, or import the starter plan: open “Workstreams, team and data”, go to Data, and choose the file rta-starter-plan.json.</p><div class="actions"><button class="btn primary edit-only" data-act="new">+ New step</button><button class="btn edit-only" data-act="data">Import the starter plan</button></div></div>`;
}
function renderSummary(){
  const ts=all(), n=ts.length||1;
  const c={done:0,prog:0,open:0,block:0,todo:0};ts.forEach(t=>c[t.status]++);

  renderDrawer(); if(view==="map")renderMap();
  setTimeout(()=>{const f=$(id?".dhead .btn":"#d-title");f&&f.focus();},30);
}

const MM={group:pref.get("mmGroup","lane"),steps:true,ideas:true,deps:true,sel:null,k:1,x:0,y:0};
function mmHubs(){
  const t=all(), iv=allIdeas();
  if(MM.group==="lane"){const h=config.lanes.map(l=>({id:"lane:"+l.id,name:l.name}));if(iv.some(i=>!config.lanes.find(l=>l.id===i.category))||t.some(x=>!config.lanes.find(l=>l.id===x.lane)))h.push({id:"lane:__general",name:"General"});return h;}
  if(MM.group==="status"){return STATUSES.map(([k,l])=>({id:"status:"+k,name:l})).concat([{id:"ideas",name:"Ideas"}]);}
  if(MM.group==="stage"){return config.stages.map(s=>({id:"stage:"+s.id,name:s.name})).concat([{id:"ideas",name:"Ideas"}]);}
  if(MM.group==="owner"){const names=[...new Set([...t.map(x=>x.owner||"No owner"),...iv.map(i=>i.ownerName||"Someone")])];return names.map(n=>({id:"owner:"+n,name:n}));}
  return [];}
function mmHubOf(item){
  if(item.type==="step"){const t=item.ref;
    if(MM.group==="lane")return "lane:"+(config.lanes.find(l=>l.id===t.lane)?t.lane:"__general");
    if(MM.group==="status")return "status:"+t.status;
    if(MM.group==="stage")return "stage:"+(config.stages.find(s=>s.id===t.stage)?t.stage:config.stages[0].id);
    return "owner:"+(t.owner||"No owner");}
  const i=item.ref;
  if(MM.group==="lane")return "lane:"+(config.lanes.find(l=>l.id===i.category)?i.category:"__general");
  if(MM.group==="owner")return "owner:"+(i.ownerName||"Someone");
  return "ideas";}
function renderMindmap(){
  const items=[];
  if(MM.steps)all().sort(byPri).forEach(t=>items.push({key:"t:"+t.id,type:"step",ref:t,label:t.title}));
  if(MM.ideas)allIdeas().sort((a,b)=>a.title.localeCompare(b.title)).forEach(i=>items.push({key:"i:"+i.id,type:"idea",ref:i,label:i.title}));
  let hubs=mmHubs();items.forEach(it=>{it.hub=mmHubOf(it);});
  hubs=hubs.filter(h=>items.some(it=>it.hub===h.id)||MM.group==="lane");
  const GAP=2, slots=items.length+GAP*hubs.length||1, step=2*Math.PI/slots;
  const R2=Math.max(330,slots*15/(2*Math.PI)), R1=Math.max(150,R2*0.46);
  let cur=-Math.PI/2+step*GAP/2;const pos={};
  hubs.forEach((h,hi)=>{const mem=items.filter(it=>it.hub===h.id);const start=cur;
    mem.forEach((it,j)=>{const a=cur+step*(j+0.5);it.a=a;it.x=Math.cos(a)*R2;it.y=Math.sin(a)*R2;pos[it.key]=it;});
    cur+=step*Math.max(mem.length,1);h.a=(start+cur)/2;h.x=Math.cos(h.a)*R1;h.y=Math.sin(h.a)*R1;h.c=MM.group==="status"&&h.id.startsWith("status:")?"var(--"+h.id.slice(7)+")":"var(--h"+(hi%8+1)+")";pos["h:"+h.id]=h;cur+=step*GAP;});
  const hubById=Object.fromEntries(hubs.map(h=>[h.id,h]));MM.hubNames=Object.fromEntries(hubs.map(h=>["h:"+h.id,h.name]));
  const q=F.q.toLowerCase();
  const hit=it=>!q||it.label.toLowerCase().includes(q);
  const cut=s=>s.length>30?s.slice(0,29).trimEnd()+"…":s;
  let edges="",cross="",nodes="",labels="";
  hubs.forEach(h=>{edges+=`<path class="mme" data-a="center" data-b="h:${esc(h.id)}" d="M0 0L${h.x.toFixed(1)} ${h.y.toFixed(1)}" stroke="${h.c}" stroke-width="2"/>`;});
  items.forEach(it=>{const h=hubById[it.hub];if(!h)return;const mx=(h.x+it.x)/2*1.04,my=(h.y+it.y)/2*1.04;
    edges+=`<path class="mme" data-a="h:${esc(h.id)}" data-b="${esc(it.key)}" d="M${h.x.toFixed(1)} ${h.y.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${it.x.toFixed(1)} ${it.y.toFixed(1)}" stroke="${h.c}" stroke-opacity=".45"/>`;});
  if(MM.deps){items.forEach(it=>{const links=it.type==="step"?it.ref.needs.map(n=>"t:"+n):it.ref.linkedTasks.map(n=>"t:"+n);
    links.forEach(k=>{const o=pos[k];if(!o)return;const cls=it.type==="step"?"dep":"ilink";
      cross+=`<path class="mme mmx ${cls}" data-a="${esc(it.key)}" data-b="${esc(k)}" d="M${o.x.toFixed(1)} ${o.y.toFixed(1)}Q${(o.x+it.x)*0.18} ${(o.y+it.y)*0.18} ${it.x.toFixed(1)} ${it.y.toFixed(1)}"/>`;});});}
  hubs.forEach(h=>{const lx=Math.cos(h.a)*22,ly=Math.sin(h.a)*22,anc=Math.abs(Math.cos(h.a))<0.3?"middle":(Math.cos(h.a)<0?"end":"start");
    nodes+=`<g class="mmn hub" data-k="h:${esc(h.id)}" transform="translate(${h.x.toFixed(1)} ${h.y.toFixed(1)})"><circle r="11" fill="${h.c}"/></g>`;
    labels+=`<text class="mml hubl" x="${(h.x+lx).toFixed(1)}" y="${(h.y+ly).toFixed(1)}" dy=".35em" text-anchor="${anc}">${esc(h.name)} <tspan class="cnt">${items.filter(it=>it.hub===h.id).length}</tspan></text>`;});
  items.forEach(it=>{const deg=it.a*180/Math.PI,left=Math.cos(it.a)<0,h=hubById[it.hub];const dim=hit(it)?"":" dim";
    const shape=it.type==="step"?`<circle r="6.5" class="st st-${it.ref.status}"/>`:`<rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" class="idn${it.ref.visibility==="private"?" priv":""}" style="--hc:${h?h.c:"var(--wine)"}"/>`;
    nodes+=`<g class="mmn${dim}${it.type==="step"&&it.ref.atRisk?" risk":""}" data-k="${esc(it.key)}" transform="translate(${it.x.toFixed(1)} ${it.y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(it.label)}">${shape}<text class="mml" transform="rotate(${left?deg+180:deg})" x="${left?-12:12}" dy=".35em" text-anchor="${left?"end":"start"}">${esc(cut(it.label))}</text></g>`;});
  const ext=R2+175;
  const grp=[["lane","Workstream"],["status","Status"],["stage","Stage"],["owner","Owner"]];
  $("#view").innerHTML=`<div class="mmbar"><div class="seg" role="group" aria-label="Group by"><span class="flabel" style="align-self:center;margin-right:4px">Group by</span>${grp.map(([k,l])=>`<button data-mmg="${k}" aria-pressed="${MM.group===k}">${l}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Show">${[["steps","Steps"],["ideas","Ideas"],["deps","Connections"]].map(([k,l])=>`<button data-mmt="${k}" aria-pressed="${MM[k]}">${l}</button>`).join("")}</div>
    <span class="help">${items.filter(i=>i.type==="step").length} steps · ${items.filter(i=>i.type==="idea").length} ideas · ${hubs.length} groups</span></div>
   <div class="mmwrap" id="mmwrap"><svg id="mmsvg" viewBox="${-ext} ${-ext} ${2*ext} ${2*ext}" role="img" aria-label="Mind map of steps and ideas, grouped by ${grp.find(g=>g[0]===MM.group)[1].toLowerCase()}">
     <g id="mmroot" transform="translate(${MM.x} ${MM.y}) scale(${MM.k})">${edges}${cross}<g class="mmn center" data-k="center"><circle r="34" fill="var(--wine)"/><text class="mmc" dy=".35em" text-anchor="middle">Ṛta</text></g>${nodes}${labels}</g></svg>
    <div class="mmzoom"><button class="ibtn" data-mmz="in" aria-label="Zoom in">+</button><button class="ibtn" data-mmz="out" aria-label="Zoom out">−</button><button class="ibtn" data-mmz="fit" aria-label="Reset view">⤢</button></div>
    <div class="mminfo" id="mminfo" hidden></div></div>
   <div class="legend"><span><i class="dot st-done"></i>Step, coloured by status</span><span><i class="mmlegd"></i>Idea</span><span><i class="mmlegd priv"></i>Private idea (only you)</span><span><i class="lline dep"></i>Needs</span><span><i class="lline ilink"></i>Idea connected to a step</span><span><i class="rbar"></i>Falling back</span></div>`;
  mmWire();if(MM.sel)mmSelect(MM.sel);
}
function mmNeighbors(k){const s=new Set([k]);$$("#mmsvg .mme").forEach(p=>{if(p.dataset.a===k)s.add(p.dataset.b);if(p.dataset.b===k)s.add(p.dataset.a);});return s;}
function mmFocus(k){const svg=$("#mmsvg");if(!svg)return;if(!k){svg.classList.remove("focus");$$("#mmsvg .on").forEach(x=>x.classList.remove("on"));return;}
  const nb=mmNeighbors(k);svg.classList.add("focus");$$("#mmsvg .mmn").forEach(n=>n.classList.toggle("on",nb.has(n.dataset.k)));$$("#mmsvg .mme").forEach(p=>p.classList.toggle("on",p.dataset.a===k||p.dataset.b===k));}
function mmSelect(k){MM.sel=k;mmFocus(k);const box=$("#mminfo");if(!box)return;if(!k||k==="center"){box.hidden=true;return;}
  let h="";
  if(k.startsWith("t:")){const t=tasks[k.slice(2)];if(!t){box.hidden=true;return;}
    const linkedIdeas=allIdeas().filter(i=>i.linkedTasks.includes(t.id));
    h=`<div class="eyebrow">Step · ${esc(laneName(t.lane))}</div><h3>${esc(t.title)}</h3><div class="meta" style="padding-left:0"><span class="pill2 st-${t.status}"><i class="dot"></i>${SLABEL[t.status]}</span>${metaHTML(t)}</div>${t.atRisk&&t.fallback?`<p class="fb">${esc(t.fallback)}</p>`:t.what?`<p>${esc(t.what)}</p>`:""}
     ${t.needs.length?`<div class="flabel">Needs</div><div class="chips">${t.needs.filter(n=>tasks[n]).map(n=>`<button class="chip" data-mmgo="t:${esc(n)}">${esc(tasks[n].title)}</button>`).join("")}</div>`:""}
     ${linkedIdeas.length?`<div class="flabel">Ideas</div><div class="chips">${linkedIdeas.map(i=>`<button class="chip" data-mmgo="i:${esc(i.id)}">${esc(i.title)}</button>`).join("")}</div>`:""}
     <button class="btn small primary" data-open="${esc(t.id)}">Open step</button>`;}
  else if(k.startsWith("i:")){const i=ideas[k.slice(2)];if(!i){box.hidden=true;return;}
    h=`<div class="eyebrow">Idea · ${esc(catName(i.category))} · ${i.visibility==="private"?"Only you":"Team"}</div><h3>${esc(i.title)}</h3><p>${esc(i.body.slice(0,200))}${i.body.length>200?"…":""}</p><div class="who">${esc(i.ownerName||"Someone")} · ${ISLABEL[i.status]} · ♥ ${i.likes.length}</div>
     ${i.linkedTasks.length?`<div class="flabel">Connected steps</div><div class="chips">${i.linkedTasks.filter(n=>tasks[n]).map(n=>`<button class="chip" data-mmgo="t:${esc(n)}">${esc(tasks[n].title)}</button>`).join("")}</div>`:""}
     <button class="btn small primary" data-idea="${esc(i.id)}">Open idea</button>`;}
  else if(k.startsWith("h:")){const n=$$("#mmsvg .mme").filter(p=>p.dataset.a===k).length;h=`<div class="eyebrow">Group</div><h3>${esc((MM.hubNames||{})[k]||"")}</h3><p class="help">${n} item${n===1?"":"s"} in this group. Click one to see how it connects.</p>`;}
  box.innerHTML=`<button class="ibtn mmx-close" data-mmclose aria-label="Close">✕</button>`+h;box.hidden=false;}
function mmApply(){const r=$("#mmroot");if(r)r.setAttribute("transform",`translate(${MM.x} ${MM.y}) scale(${MM.k})`);}
function mmWire(){const svg=$("#mmsvg");if(!svg)return;let drag=null,moved=false;
  const toSvg=(cx,cy)=>{const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());};
  svg.addEventListener("wheel",e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);const f=e.deltaY<0?1.15:1/1.15;const k=Math.min(4,Math.max(0.35,MM.k*f));MM.x=p.x-(p.x-MM.x)*(k/MM.k);MM.y=p.y-(p.y-MM.y)*(k/MM.k);MM.k=k;mmApply();},{passive:false});
  svg.addEventListener("pointerdown",e=>{if(e.target.closest(".mmn"))return;drag={x:e.clientX,y:e.clientY,ox:MM.x,oy:MM.y};moved=false;svg.setPointerCapture(e.pointerId);});
  svg.addEventListener("pointermove",e=>{if(drag){const a=toSvg(drag.x,drag.y),b=toSvg(e.clientX,e.clientY);MM.x=drag.ox+(b.x-a.x);MM.y=drag.oy+(b.y-a.y);if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3)moved=true;mmApply();return;}
    const n=e.target.closest(".mmn");if(!MM.sel)mmFocus(n?n.dataset.k:null);});
  svg.addEventListener("pointerup",e=>{if(drag&&!moved){mmSelect(null);}drag=null;});
  svg.addEventListener("pointerleave",()=>{if(!MM.sel)mmFocus(null);});
  svg.addEventListener("click",e=>{const n=e.target.closest(".mmn");if(n){e.stopPropagation();mmSelect(n.dataset.k);}});
  svg.addEventListener("keydown",e=>{const n=e.target.closest(".mmn");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();mmSelect(n.dataset.k);}});}
function mmClick(e){
  const g=e.target.closest("[data-mmg]"); if(g){MM.group=g.dataset.mmg;pref.set("mmGroup",MM.group);MM.sel=null;renderMindmap();return true;}
  const t=e.target.closest("[data-mmt]"); if(t){MM[t.dataset.mmt]=!MM[t.dataset.mmt];MM.sel=null;renderMindmap();return true;}
  const z=e.target.closest("[data-mmz]"); if(z){const d=z.dataset.mmz;if(d==="fit"){MM.k=1;MM.x=0;MM.y=0;}else{MM.k=Math.min(4,Math.max(0.35,MM.k*(d==="in"?1.25:0.8)));}mmApply();return true;}
  const go=e.target.closest("[data-mmgo]"); if(go){mmSelect(go.dataset.mmgo);return true;}
  if(e.target.closest("[data-mmclose]")){mmSelect(null);return true;}
  return false;}

// ---------- toast ----------
let tt;function toast(m){$("#toastbox").innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>{$("#toastbox").innerHTML="";},2600);}

// ---------- events ----------
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");
  if(await ideaClick(e))return; if(mmClick(e))return;
  const tile=e.target.closest("[data-sf]"); if(tile){F.status=F.status===tile.dataset.sf?"":tile.dataset.sf; if(["overview","ideas","mindmap"].includes(view))view="list"; render(); return;}
  const tab=e.target.closest(".tabs [data-view]"); if(tab){view=tab.dataset.view;pref.set("view",view);render();return;}
  const sortTh=e.target.closest("th[data-sort]"); if(sortTh){const k=sortTh.dataset.sort;sortDir=sortKey===k?-sortDir:1;sortKey=k;pref.set("sortKey",k);pref.set("sortDir",sortDir);renderList();return;}
  if(e.target.closest("select[data-inline]"))return;
  const addc=e.target.closest("[data-add-lane],[data-add-status]"); if(addc){openDrawer(null,addc.dataset.addLane?{lane:addc.dataset.addLane,stage:addc.dataset.addStage}:{status:addc.dataset.addStatus});return;}
  const op=e.target.closest("[data-open]"); if(op){dirty=false;openDrawer(op.dataset.open);return;}
  // drawer controls
  const drm=e.target.closest("[data-deprm]"); if(drm&&draft){readForm();draft.needs=draft.needs.filter(x=>x!==drm.dataset.deprm);dirty=true;renderDrawer();return;}
  const setb=e.target.closest("[data-set]"); if(setb&&draft){readForm();draft[setb.dataset.set]=setb.dataset.set==="priority"?Number(setb.dataset.v):setb.dataset.v;dirty=true;renderDrawer();return;}
  const dn=e.target.closest("[data-delnote]"); if(dn&&draft&&openId){readForm();const t=Object.assign({},tasks[openId]);t.notes=t.notes.filter(n=>n.id!==dn.dataset.delnote);if(await saveTask(t,"Note removed")){draft.notes=t.notes;renderDrawer();}return;}
  // settings controls
  const mt=e.target.closest("[data-mtab]"); if(mt){syncSettingsInputs();mtab=mt.dataset.mtab;mconfirm=null;renderSettings();return;}
  const mv=e.target.closest("[data-mv]"); if(mv){syncSettingsInputs();const L=mdraft[mv.dataset.mv],i=+mv.dataset.i,j=i+Number(mv.dataset.d);if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];}renderSettings();return;}
  const rm=e.target.closest("[data-rm]"); if(rm){syncSettingsInputs();const k=rm.dataset.rm,i=+rm.dataset.i;
    if(k==="people"){mdraft.people.splice(i,1);renderSettings();return;}
    if(mdraft[k].length<=1){toast("Keep at least one.");return;}
    mconfirm={kind:k,i};renderSettings();return;}
  const ad=e.target.closest("[data-add]"); if(ad){syncSettingsInputs();const k=ad.dataset.add;
    if(k==="lanes")mdraft.lanes.push({id:uid("w"),name:"New workstream",sub:""});
    if(k==="stages")mdraft.stages.push({id:uid("s"),name:"New stage"});
    if(k==="people")mdraft.people.push("");
    renderSettings();const ins=$$(".erow input");ins.length&&ins[ins.length-(k==="lanes"?2:1)].select();return;}
  const row=!a&&e.target.closest("tbody tr[data-id], .knot[data-id], .card[data-id], .ilist [data-id]"); if(row){openDrawer(row.dataset.id);return;}
  if(!a)return;
  const act=a.dataset.act;
  if(act==="new"){openDrawer(null);}
  else if(act==="data"){openSettings("data");}
  else if(act==="close"){closeDrawer();}
  else if(act==="save"){await saveDraft();}
  else if(act==="delete"){readForm();confirmDel=true;renderDrawer();}
  else if(act==="canceldelete"){confirmDel=false;renderDrawer();}
  else if(act==="reallydelete"){const id=openId;const ok=await write(async()=>{await store.deleteTask(id);for(const t of all().filter(t=>t.needs.includes(id))){await store.saveTask(stamp(Object.assign({},t,{needs:t.needs.filter(n=>n!==id)})));}},"Step deleted");if(ok)closeDrawer();}
  else if(act==="duplicate"){readForm();const c=Object.assign({},JSON.parse(JSON.stringify(draft)),{id:uid(),title:draft.title+" (copy)",notes:[],updatedAt:"",order:draft.order+0.5});openId=null;drawerOpen=true;dirty=true;draft=c;confirmDel=false;renderDrawer();toast("Copy ready. Edit it, then add it.");}
  else if(act==="addnote"){const inp=$("#d-note");const txt=inp&&inp.value.trim();if(!txt)return;readForm();
    const t=Object.assign({},tasks[openId]);t.notes=[...t.notes,{id:uid("n"),at:new Date().toISOString(),by:me||"",text:txt}];
    if(t.notes.length>60)t.notes=t.notes.slice(-60);
    const ok=await saveTask(t,"Note added");if(ok&&draft){draft.notes=t.notes;renderDrawer();}}
  else if(act==="closeset"){closeSettings();}
  else if(act==="saveset"){await saveSettings();}
  else if(act==="cancelconfirm"){mconfirm=null;renderSettings();}
  else if(act==="reallyremove"){syncSettingsInputs();const {kind,i}=mconfirm;const removed=mdraft[kind][i];const sel=$("#m-target");const field=kind==="lanes"?"lane":"stage";
    if(sel)pendingMoves.push({field,from:removed.id,to:sel.value});mdraft[kind].splice(i,1);mconfirm=null;renderSettings();}
  else if(act==="copyjson"){const txt=exportData();try{await navigator.clipboard.writeText(txt);toast("Copied. Paste it somewhere safe.");}catch(err){const ta=$("#m-json");if(ta){ta.value=txt;ta.select();toast("Copy blocked. The JSON is selected in the box below.");}}}
  else if(act==="savejson"){const blob=new Blob([exportData()],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="rta-tracker-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  else if(act==="signin"){try{await fbApi.signIn();}catch(err){if(err&&err.code!=="auth/popup-closed-by-user")toast("Sign-in didn't finish. If a pop-up was blocked, allow pop-ups for this site and try again.");}}
  else if(act==="signout"){try{await fbApi.signOut();}catch(err){}}
  else if(act==="import"){try{const d=parseImport($("#m-json").value);mconfirm={kind:"import",n:d.tasks.length,data:d};renderSettings();}catch(err){toast("That isn't tracker JSON. Export from a tracker and paste it here.");}}
  else if(act==="reallyimport"){const d=mconfirm.data;const ok=await write(()=>store.replaceAll(d.config,d.tasks.map(stamp)),"Imported "+d.tasks.length+" steps");if(ok)closeSettings();}
  else if(act==="reset"){mconfirm={kind:"reset"};renderSettings();}
  else if(act==="reallyreset"){const s=JSON.parse(JSON.stringify(window.RTA_SEED));const ok=await write(()=>store.replaceAll(normCfg(s.config),s.tasks.map(norm)),"Reset to the starter plan");if(ok)closeSettings();}
});
document.addEventListener("change",async e=>{
  if(ideaChange(e))return;
  if(e.target.id==="d-depadd"&&draft){const id=e.target.value;if(!id)return;readForm();draft.needs=[...new Set([...draft.needs,id])];dirty=true;renderDrawer();const s2=$("#d-depadd");s2&&s2.focus();return;}
  const sel=e.target.closest("select[data-inline]"); if(sel){const t=Object.assign({},tasks[sel.dataset.tid]);t[sel.dataset.inline]=sel.dataset.inline==="priority"?Number(sel.value):sel.value;await saveTask(t,"Saved");return;}
  const dep=e.target.closest("[data-dep]"); if(dep&&draft){readForm();const id=dep.dataset.dep;draft.needs=dep.checked?[...new Set([...draft.needs,id])]:draft.needs.filter(x=>x!==id);dirty=true;return;}
  if(e.target.id==="m-file"){const f=e.target.files&&e.target.files[0];if(!f)return;try{$("#m-json").value=await f.text();}catch(err){toast("Couldn't read that file.");}return;}
  if(e.target.closest(".drawer")){dirty=true;}
  if(e.target.id==="fpri"){F.pri=e.target.value;render();} if(e.target.id==="fown"){F.own=e.target.value;render();} if(e.target.id==="flane"){F.lane=e.target.value;render();} if(e.target.id==="frisk"){F.risk=e.target.checked;render();}
});
document.addEventListener("input",e=>{
  if(ideaInput(e))return;
  if(e.target.id==="fq"){F.q=e.target.value;clearTimeout(window._fq);window._fq=setTimeout(render,150);}
  if(e.target.closest(".drawer")&&e.target.id!=="d-depq"&&e.target.id!=="d-note")dirty=true;
  if(e.target.id==="d-depq"){depQ=e.target.value;readForm();const pos=e.target.selectionStart;renderDrawer();const i=$("#d-depq");i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(ideaOpen)closeIdea();else if(drawerOpen)closeDrawer();else if(mdraft)closeSettings();}
  if((e.key==="Enter")&&e.target.id==="d-note"){e.preventDefault();document.querySelector('[data-act="addnote"]').click();}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("th[data-sort]")){e.preventDefault();e.target.click();}
  if((e.key==="Enter")&&e.target.matches(".icard")){e.preventDefault();openIdea(e.target.dataset.idea);}
});
$("#newbtn").addEventListener("click",()=>openDrawer(null));
$("#setbtn").addEventListener("click",()=>openSettings("lanes"));
$("#fclear").addEventListener("click",()=>{Object.assign(F,{q:"",pri:"",own:"",lane:"",risk:false,status:""});$("#fq").value="";$("#fpri").value="";$("#fown").value="";$("#flane").value="";$("#frisk").checked=false;render();});

// drag and drop: map cells change workstream and stage, board columns change status
let dragId=null;
document.addEventListener("dragstart",e=>{const k=e.target.closest("[data-id][draggable=true]");if(!k)return;dragId=k.dataset.id;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId);}catch(_){}});
document.addEventListener("dragover",e=>{const z=e.target.closest(".cell[data-lane]:not([data-lane='__none']),.col[data-status]");if(!z||!dragId)return;e.preventDefault();$$(".over").forEach(x=>x!==z&&x.classList.remove("over"));z.classList.add("over");});
document.addEventListener("dragleave",e=>{const z=e.target.closest(".over");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over");});
document.addEventListener("drop",async e=>{const z=e.target.closest(".cell[data-lane],.col[data-status]");$$(".over").forEach(x=>x.classList.remove("over"));if(!z||!dragId)return;e.preventDefault();
  const t=Object.assign({},tasks[dragId]);dragId=null;if(!t.id)return;
  if(z.dataset.status){if(t.status===z.dataset.status)return;t.status=z.dataset.status;await saveTask(t,"Moved to "+SLABEL[t.status]);}
  else{if(t.lane===z.dataset.lane&&t.stage===z.dataset.stage)return;t.lane=z.dataset.lane;t.stage=z.dataset.stage;await saveTask(t,"Moved");}});
document.addEventListener("dragend",()=>{dragId=null;$$(".over").forEach(x=>x.classList.remove("over"));});

})();
